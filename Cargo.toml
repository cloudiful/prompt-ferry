[workspace]
members = [".", "tools/db-init", "crates/prompt-ferry-upstream-presets", "crates/prompt-ferry-redact", "crates/prompt-ferry-runtime-env", "crates/prompt-ferry-redact-upstream"]
default-members = [".", "tools/db-init", "crates/prompt-ferry-upstream-presets", "crates/prompt-ferry-redact", "crates/prompt-ferry-runtime-env", "crates/prompt-ferry-redact-upstream"]

[package]
name = "prompt-ferry"
version = "1.45.3"
edition = "2024"
license = "Apache-2.0"
readme = "README.md"
description = "OpenAI-compatible peer node gateway for upstream ferrying"
default-run = "prompt-ferry"

[lints.clippy]
large_futures = "deny"

[lib]
name = "prompt_ferry"

[[bin]]
name = "prompt-ferry"
path = "src/main.rs"

[[bin]]
name = "export-openapi"
path = "src/bin/export-openapi.rs"

[features]
default = ["embedded-frontend"]
embedded-frontend = ["dep:include_dir"]

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
async-openai = { version = "0.43.0", default-features = false, features = ["realtime-types"] }
async-trait = "0.1.92"
async-stream = "0.3.6"
axum = { version = "0.8.9", features = ["json", "macros", "ws"] }
base64 = "0.23.1"
bincode = "1.3.3"
bytes = "1.12.2"
chacha20poly1305 = "0.11.0"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.8", features = ["derive", "env"] }
cloudiful-authz = { version = "0.1.0", git = "https://github.com/cloudiful/authz.git", rev = "6b4235bbb75757fc2426760b3344be4c3526f7d7" }
cloudiful-notifier = { version = "0.3", git = "https://github.com/cloudiful/notifier.git", tag = "v0.3.2", default-features = false, features = ["dingtalk", "email"] }
config = { package = "cloudiful-config", version = "0.6.3", git = "https://github.com/cloudiful/config.git", tag = "v0.6.3" }
db-init = { package = "cloudiful-db-init", version = "0.1.0", git = "https://github.com/cloudiful/db-init.git", rev = "a3612a2ae92343540077bd625aa7c228de75f254" }
futures = "0.3.34"
h2 = "0.4.20"
hkdf = "0.13.0"
http = "1.5.0"
hyper = { version = "1.12.0", features = ["http1", "client"] }
ipnet = "2.12.2"
rand = "0.10.4"
rcgen = "0.14.10"
redactor = { package = "cloudiful-redactor", version = "0.5.1", git = "https://github.com/cloudiful/redactor.git", tag = "v0.5.1" }
redis = { version = "1.8.2", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.13.5", default-features = false, features = ["charset", "gzip", "http2", "json", "rustls", "socks", "stream", "system-proxy"] }
prompt-ferry-redact = { version = "0.1.0", path = "crates/prompt-ferry-redact" }
prompt-ferry-redact-upstream = { version = "0.1.0", path = "crates/prompt-ferry-redact-upstream" }
prompt-ferry-runtime-env = { version = "0.1.0", path = "crates/prompt-ferry-runtime-env" }
prompt-ferry-upstream-presets = { version = "0.1.0", path = "crates/prompt-ferry-upstream-presets" }
sse-stream = "0.2"
rmcp = { version = "3.11.0", features = ["auth", "client", "transport-streamable-http-client-reqwest", "transport-child-process", "transport-streamable-http-server"] }
scheduler = { package = "cloudiful-scheduler", version = "0.4.12", git = "https://github.com/cloudiful/scheduler.git", tag = "v0.4.12", features = ["valkey-store"] }
rustls = { version = "0.23.46", features = ["aws-lc-rs"] }
rustls-native-certs = "0.8.5"
rustls-pki-types = "1.16.0"
sea-orm = { version = "=2.0.4", default-features = false, features = [ "macros", "sqlx-postgres", "sqlx-sqlite", "runtime-tokio", "with-json", "with-chrono", "with-uuid", "postgres-use-serial-pk" ] }
sea-query-sqlx = { version = "0.9.1", features = [ "sqlx-postgres", "sqlx-sqlite", "postgres-array", "with-chrono", "with-json", "with-uuid" ] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.1", features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "sqlite", "chrono", "uuid", "json", "macros", "migrate", "sqlx-toml"] }
tokio = { version = "1.54.1", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = "0.26.6"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["compression-br", "compression-gzip", "cors", "decompression-gzip", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
utoipa = { version = "6.0.0", features = ["chrono", "uuid", "yaml"] }
urlencoding = "2.1.3"
uuid = { version = "1.29.3", features = ["serde", "v4"] }
zstd = "0.14.4"
include_dir = { version = "0.7.4", optional = true }

[dev-dependencies]
proptest = "1.12.0"
