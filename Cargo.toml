[workspace]
members = [".", "tools/db-init", "tools/usage-replay-backfill"]
default-members = [".", "tools/db-init", "tools/usage-replay-backfill"]

[package]
name = "prompt-ferry"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
readme = "README.md"
description = "OpenAI-compatible relay and worker for upstream ferrying"
default-run = "prompt-ferry"

[lib]
name = "prompt_ferry"

[[bench]]
name = "stream_delta_batcher"
harness = false

[[bench]]
name = "redaction_pipeline"
harness = false

[[bin]]
name = "prompt-ferry"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.5.3"
async-openai = { version = "0.41.1", default-features = false, features = ["realtime-types"] }
async-trait = "0.1.91"
async-stream = "0.3.6"
axum = { version = "0.8.9", features = ["json", "macros", "ws"] }
base64 = "0.23.0"
bincode = "1.3.3"
bytes = "1.12.1"
chacha20poly1305 = "0.11.0"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.4", features = [ "derive", "env" ] }
config = { package = "cloudiful-config", version = "0.6.3" }
db-init = { package = "cloudiful-db-init", version = "0.1.0" }
futures = "0.3.33"
h2 = "0.4.15"
hkdf = "0.13.0"
http = "1.4.2"
hyper = { version = "1.11.0", features = ["http1", "client"] }
ipnet = "2.12.0"
rand = "0.10.2"
rcgen = "0.14.8"
redactor = { package = "cloudiful-redactor", version = "0.5.1" }
redis = { version = "1.4.1", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.13.4", default-features = false, features = ["charset", "gzip", "http2", "json", "rustls", "stream", "system-proxy"] }
object_store = { version = "0.14.1", default-features = false, features = ["aws"] }
rmcp = { version = "3.1.1", features = ["client", "transport-streamable-http-client-reqwest", "transport-child-process", "transport-streamable-http-server"] }
sse-stream = "0.2.4"
scheduler = { package = "cloudiful-scheduler", version = "0.4.12", features = ["valkey-store"] }
rustls = { version = "0.23.42", features = ["aws-lc-rs"] }
rustls-native-certs = "0.8.4"
rustls-pki-types = "1.15.1"
rust_decimal = { version = "1.42.1", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "chrono", "uuid", "json", "macros", "migrate", "sqlx-toml", "rust_decimal"] }
tokio = { version = "1.53.1", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = "0.26.4"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["cors", "decompression-gzip", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
utoipa = { version = "5.5.0", features = ["chrono", "uuid", "yaml"] }
urlencoding = "2.1.3"
uuid = { version = "1.24.0", features = ["serde", "v4"] }
zstd = "0.13.3"

[dev-dependencies]
flate2 = "1.1.9"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "chrono", "uuid", "json", "macros", "migrate", "sqlx-toml"] }
