[package]
name = "prompt-ferry-db-init"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "db_init"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive", "env"] }
prompt-ferry = { path = "../.." }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1.26.1", features = ["v4"] }
