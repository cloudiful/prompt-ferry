[package]
name = "prompt-ferry-db-init"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "db_init"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive", "env"] }
db-init = { package = "cloudiful-db-init", version = "0.1.0" }
config = { package = "cloudiful-config", version = "0.6.3" }
dotenvy = "0.15.7"
serde_json = "1.0.150"
sqlx = { version = "0.9.0", features = ["migrate"] }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
