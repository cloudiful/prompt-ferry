[package]
name = "prompt-ferry-db-init"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Database initialization helper for prompt-ferry"

[[bin]]
name = "db_init"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive", "env"] }
prompt-ferry = { path = "../.." }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1.29.3", features = ["v4"] }
