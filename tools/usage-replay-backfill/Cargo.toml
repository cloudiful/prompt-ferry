[package]
name = "prompt-ferry-usage-replay-backfill"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "usage_replay_backfill"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive", "env"] }
prompt-ferry = { path = "../.." }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
