[package]
name = "prompt-ferry-redact-upstream"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Stateful upstream redaction sessions for prompt-ferry"

[dependencies]
anyhow = "1.0.104"
prompt-ferry-redact = { version = "0.1.0", path = "../prompt-ferry-redact" }
prompt-ferry-runtime-env = { version = "0.1.0", path = "../prompt-ferry-runtime-env" }
redactor = { package = "cloudiful-redactor", version = "0.5.1" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
base64 = "0.23.1"
