[package]
name = "prompt-ferry-llm-review"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "LLM review gate and approval webhook helpers for prompt-ferry"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
reqwest = { version = "0.13.5", default-features = false, features = ["charset", "gzip", "http2", "json", "rustls", "socks", "stream", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "chrono", "uuid", "json", "macros"] }
tokio = { version = "1.53.1", features = ["rt", "sync", "time"] }
tracing = "0.1.44"
utoipa = { version = "5.5.0", features = ["chrono", "uuid"] }
uuid = { version = "1.26.1", features = ["serde", "v4"] }
