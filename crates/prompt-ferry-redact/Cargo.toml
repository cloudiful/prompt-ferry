[package]
name = "prompt-ferry-redact"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Redaction runtime and policy types for prompt-ferry"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
redactor = { package = "cloudiful-redactor", version = "0.5.1", git = "https://github.com/cloudiful/redactor.git", tag = "v0.5.1" }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["sync"] }

[dev-dependencies]
serde_json = "1.0.154"
