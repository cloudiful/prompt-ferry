name: Quality

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Rust and frontend checks
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
        ports:
          - 5432:5432
    env:
      CARGO_TERM_COLOR: always
      SQLX_OFFLINE: "true"
      PROMPT_FERRY_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Restore Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/package.json', 'frontend/bunfig.toml') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Rust tests
        run: cargo test --workspace

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --no-save

      - name: Check frontend formatting
        working-directory: frontend
        run: bun run format:check

      - name: Check frontend types
        working-directory: frontend
        run: bun run typecheck

      - name: Build frontend
        working-directory: frontend
        run: bun run build

      - name: Export backend OpenAPI
        run: cargo run -- openapi export

      - name: Regenerate frontend OpenAPI SDK
        working-directory: frontend
        run: bun run openapi-ts

      - name: Check generated OpenAPI files
        run: git diff --exit-code -- openapi/admin-api.yaml frontend/src/generated/admin-api

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan repository
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
