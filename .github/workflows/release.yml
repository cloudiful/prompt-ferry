name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BIN_NAME: prompt-ferry
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-binaries:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            executable: prompt-ferry
            release_suffix: ""
            msvc_arch: ""
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            executable: prompt-ferry
            release_suffix: ""
            msvc_arch: ""
          - target: aarch64-apple-darwin
            runner: macos-14
            executable: prompt-ferry
            release_suffix: ""
            msvc_arch: ""
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
            executable: prompt-ferry.exe
            release_suffix: .exe
            msvc_arch: x64
          - target: aarch64-pc-windows-msvc
            runner: windows-2022
            executable: prompt-ferry.exe
            release_suffix: .exe
            msvc_arch: amd64_arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      SQLX_OFFLINE: "true"
      TARGET: ${{ matrix.target }}
      RELEASE_BINARY: prompt-ferry-${{ github.ref_name }}-${{ matrix.target }}${{ matrix.release_suffix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: v0.16.0

      - name: Set up MSVC environment
        if: matrix.msvc_arch != ''
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Build binary
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RUSTC_WRAPPER: sccache
          SCCACHE_BASEDIRS: ${{ github.workspace }}
          SCCACHE_BUCKET: sccache
          SCCACHE_ENDPOINT: https://12412d5b061683494ea3e5c217d6a961.r2.cloudflarestorage.com
          SCCACHE_REGION: auto
        run: cargo build --release --bin prompt-ferry --target "${{ matrix.target }}"

      - name: Show sccache stats
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RUSTC_WRAPPER: sccache
          SCCACHE_BASEDIRS: ${{ github.workspace }}
          SCCACHE_BUCKET: sccache
          SCCACHE_ENDPOINT: https://12412d5b061683494ea3e5c217d6a961.r2.cloudflarestorage.com
          SCCACHE_REGION: auto
        run: sccache --show-stats

      - name: Prepare binary
        shell: bash
        run: |
          set -euo pipefail
          cp "target/${TARGET}/release/${{ matrix.executable }}" "$RELEASE_BINARY"

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: ${{ env.RELEASE_BINARY }}
          if-no-files-found: error
          retention-days: 7

  build-image-inputs:
    name: Build Docker input ${{ matrix.arch }}
    needs:
      - build-binaries
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      BINARY_NAME: prompt-ferry-${{ github.ref_name }}-${{ matrix.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Linux binary
        uses: actions/download-artifact@v8
        with:
          name: binary-${{ matrix.target }}
          path: binary-artifact

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Restore Bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ matrix.arch }}-${{ hashFiles('frontend/package.json', 'frontend/bunfig.toml') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ matrix.arch }}-
            ${{ runner.os }}-bun-

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --no-save

      - name: Prepare image input directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-image-input/frontend-dist
          install -Dm755 "binary-artifact/${BINARY_NAME}" ci-image-input/prompt-ferry

      - name: Export OpenAPI
        run: ci-image-input/prompt-ferry openapi export

      - name: Build frontend
        working-directory: frontend
        run: |
          bun run openapi-ts
          bun run build
          cp -R dist/. ../ci-image-input/frontend-dist/

      - name: Upload Docker input
        uses: actions/upload-artifact@v7
        with:
          name: docker-input-${{ matrix.arch }}
          path: ci-image-input
          if-no-files-found: error
          retention-days: 7

  build-images:
    name: Publish Docker image ${{ matrix.arch }}
    needs:
      - build-image-inputs
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Docker input
        uses: actions/download-artifact@v8
        with:
          name: docker-input-${{ matrix.arch }}
          path: ci-image-input

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.ref_name }}-${{ matrix.arch }}
            type=raw,value=latest-${{ matrix.arch }}

      - name: Build and push ${{ matrix.arch }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=prompt-ferry-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=prompt-ferry-${{ matrix.arch }}

  publish-manifest:
    name: Publish multi-architecture manifest
    needs:
      - build-images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Publish version and latest manifests
        shell: bash
        run: |
          set -euo pipefail
          version_tag="${IMAGE_NAME}:${{ github.ref_name }}"
          latest_tag="${IMAGE_NAME}:latest"
          docker buildx imagetools create \
            --tag "$version_tag" \
            "${version_tag}-amd64" \
            "${version_tag}-arm64"
          docker buildx imagetools create \
            --tag "$latest_tag" \
            "${IMAGE_NAME}:latest-amd64" \
            "${IMAGE_NAME}:latest-arm64"
          docker buildx imagetools inspect "$version_tag"

  release:
    name: Create GitHub Release
    needs:
      - build-binaries
      - publish-manifest
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: sha256sum prompt-ferry-* > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: prompt-ferry ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            prompt-ferry-*
            SHA256SUMS
