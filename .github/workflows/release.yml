name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BIN_NAME: prompt-ferry
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-binaries:
    name: Build ${{ matrix.target }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            archive_ext: tar.gz
            executable: prompt-ferry
            msvc_arch: ""
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            archive_ext: tar.gz
            executable: prompt-ferry
            msvc_arch: ""
          - target: aarch64-apple-darwin
            runner: macos-14
            archive_ext: tar.gz
            executable: prompt-ferry
            msvc_arch: ""
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
            archive_ext: zip
            executable: prompt-ferry.exe
            msvc_arch: x64
          - target: aarch64-pc-windows-msvc
            runner: windows-2022
            archive_ext: zip
            executable: prompt-ferry.exe
            msvc_arch: amd64_arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      SQLX_OFFLINE: "true"
      TARGET: ${{ matrix.target }}
      RELEASE_ARCHIVE: prompt-ferry-${{ needs.prepare.outputs.tag }}-${{ matrix.target }}.${{ matrix.archive_ext }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up MSVC environment
        if: matrix.msvc_arch != ''
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Build binary
        run: cargo build --release --bin prompt-ferry --target "${{ matrix.target }}"

      - name: Package binary
        shell: bash
        run: |
          set -euo pipefail
          rm -rf package
          mkdir -p package
          cp "target/${TARGET}/release/${{ matrix.executable }}" package/
          cp LICENSE README.md package/
          if [[ "${{ matrix.archive_ext }}" == "zip" ]]; then
            pwsh -NoProfile -Command 'Compress-Archive -Path package/* -DestinationPath $env:RELEASE_ARCHIVE'
          else
            tar -czf "$RELEASE_ARCHIVE" -C package .
          fi

      - name: Upload binary archive
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: ${{ env.RELEASE_ARCHIVE }}
          if-no-files-found: error
          retention-days: 7

  build-image-inputs:
    name: Build Docker input ${{ matrix.arch }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      SQLX_OFFLINE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: docker-${{ matrix.arch }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Restore Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ matrix.arch }}-${{ hashFiles('frontend/package.json', 'frontend/bunfig.toml') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ matrix.arch }}-
            ${{ runner.os }}-bun-

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --no-save

      - name: Build backend binary
        run: cargo build --release --bin prompt-ferry

      - name: Prepare image input directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-image-input/frontend-dist
          install -Dm755 target/release/prompt-ferry ci-image-input/prompt-ferry

      - name: Export OpenAPI
        run: ci-image-input/prompt-ferry openapi export

      - name: Build frontend
        working-directory: frontend
        run: |
          bun run openapi-ts
          bun run build
          cp -R dist/. ../ci-image-input/frontend-dist/

      - name: Upload Docker input
        uses: actions/upload-artifact@v4
        with:
          name: docker-input-${{ matrix.arch }}
          path: ci-image-input
          if-no-files-found: error
          retention-days: 7

  build-images:
    name: Publish Docker image ${{ matrix.arch }}
    needs:
      - prepare
      - build-image-inputs
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download Docker input
        uses: actions/download-artifact@v4
        with:
          name: docker-input-${{ matrix.arch }}
          path: ci-image-input

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.tag }}-${{ matrix.arch }}
            type=raw,value=latest-${{ matrix.arch }}

      - name: Build and push ${{ matrix.arch }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=prompt-ferry-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=prompt-ferry-${{ matrix.arch }}

  publish-manifest:
    name: Publish multi-architecture manifest
    needs:
      - prepare
      - build-images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Publish version and latest manifests
        shell: bash
        run: |
          set -euo pipefail
          version_tag="${IMAGE_NAME}:${{ needs.prepare.outputs.tag }}"
          latest_tag="${IMAGE_NAME}:latest"
          docker buildx imagetools create \
            --tag "$version_tag" \
            "${version_tag}-amd64" \
            "${version_tag}-arm64"
          docker buildx imagetools create \
            --tag "$latest_tag" \
            "${IMAGE_NAME}:latest-amd64" \
            "${IMAGE_NAME}:latest-arm64"
          docker buildx imagetools inspect "$version_tag"

  release:
    name: Create GitHub Release
    needs:
      - prepare
      - build-binaries
      - publish-manifest
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download binary archives
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: sha256sum prompt-ferry-* > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: prompt-ferry ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          files: |
            prompt-ferry-*
            SHA256SUMS
