# Fresh stack only. Existing installations must follow MIGRATING.md first.
services:
  postgres:
    # TimescaleDB 2.32.0 on PostgreSQL 18 (multi-arch index digest). The image is
    # the deployment precondition for the columnstore; if its entrypoint does not
    # create the extension in the application database, run
    # `CREATE EXTENSION IF NOT EXISTS timescaledb` once as a superuser.
    image: timescale/timescaledb:2.32.0-pg18@sha256:83952d54cfc74d9aebe4aba6ecf2af829c2bcf1f30058dded4c18ab3720a247a
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:${PROMPT_FERRY_POSTGRES_PORT:-5432}:5432"

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes", "--dir", "/data"]
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:${PROMPT_FERRY_VALKEY_PORT:-6379}:6379"

  prompt-ferry:
    image: ${PROMPT_FERRY_IMAGE:?set PROMPT_FERRY_IMAGE}
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 180s
    command: []
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      PROMPT_FERRY__BIND: 0.0.0.0:8787
      PROMPT_FERRY__MASTER_SECRET: ${PROMPT_FERRY__MASTER_SECRET:?set a stable master secret}
      PROMPT_FERRY__DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      PROMPT_FERRY__PEER_URLS: ${PROMPT_FERRY__PEER_URLS:-[]}
      PROMPT_FERRY__VALKEY_URL: ${PROMPT_FERRY__VALKEY_URL:-redis://valkey:6379}
      PROMPT_FERRY__LOG_LEVEL: ${PROMPT_FERRY__LOG_LEVEL:-info}
      PROMPT_FERRY__SHUTDOWN_DRAIN_SECONDS: ${PROMPT_FERRY__SHUTDOWN_DRAIN_SECONDS:-120}
      PROMPT_FERRY__MCP_WARMUP: ${PROMPT_FERRY__MCP_WARMUP:-all}
      PROMPT_FERRY__MCP_OAUTH_REDIRECT_BASE: ${PROMPT_FERRY__MCP_OAUTH_REDIRECT_BASE:-}
      PROMPT_FERRY__UPSTREAM_API_KEY: ${PROMPT_FERRY__UPSTREAM_API_KEY:-}
      XDG_DATA_HOME: /var/lib/prompt-ferry
      XDG_CONFIG_HOME: /etc/prompt-ferry
    volumes:
      - prompt-ferry-data:/var/lib/prompt-ferry
      - prompt-ferry-config:/etc/prompt-ferry
      - prompt-ferry-uv-cache:/root/.cache/uv
      - prompt-ferry-uv-data:/root/.local/share/uv
    # This example uses plaintext only on a trusted local network. For native
    # TLS/mTLS replace this probe with one that validates TLS and client auth.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8787 || exit 1;
          printf 'GET /healthz HTTP/1.0\r\nHost: 127.0.0.1\r\nConnection: close\r\n\r\n' >&3;
          IFS= read -r -t 2 line <&3 || exit 1;
          line=$${line%$$'\r'}; case "$$line" in "HTTP/1.0 200"|"HTTP/1.0 200 "*|"HTTP/1.1 200"|"HTTP/1.1 200 "*) ;; *) exit 1;; esac
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    ports:
      - "127.0.0.1:${PROMPT_FERRY_PORT:-8787}:8787"

volumes:
  postgres18-data:
  valkey-data:
  prompt-ferry-data:
  prompt-ferry-config:
  prompt-ferry-uv-cache:
  prompt-ferry-uv-data:
