# Fresh stack only. Existing installations must follow MIGRATING.md first.
services:
  postgres:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:${PROMPT_FERRY_POSTGRES_PORT:-5432}:5432"

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes", "--dir", "/data"]
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:${PROMPT_FERRY_VALKEY_PORT:-6379}:6379"

  rustfs:
    image: rustfs/rustfs:1.0.1
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${PROMPT_FERRY__RAW_OBJECT_STORE_ACCESS_KEY:?set object store access key}
      RUSTFS_SECRET_KEY: ${PROMPT_FERRY__RAW_OBJECT_STORE_SECRET_KEY:?set object store secret key}
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:${PROMPT_FERRY_RUSTFS_PORT:-9000}:9000"
      - "127.0.0.1:${PROMPT_FERRY_RUSTFS_CONSOLE_PORT:-9001}:9001"

  prompt-ferry:
    image: ${PROMPT_FERRY_IMAGE:?set PROMPT_FERRY_IMAGE}
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 180s
    command: []
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    environment:
      PROMPT_FERRY__BIND: 0.0.0.0:8787
      PROMPT_FERRY__MASTER_SECRET: ${PROMPT_FERRY__MASTER_SECRET:?set a stable master secret}
      PROMPT_FERRY__DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      PROMPT_FERRY__PEER_URLS: ${PROMPT_FERRY__PEER_URLS:-[]}
      PROMPT_FERRY__VALKEY_URL: ${PROMPT_FERRY__VALKEY_URL:-redis://valkey:6379}
      PROMPT_FERRY__LOG_LEVEL: ${PROMPT_FERRY__LOG_LEVEL:-info}
      PROMPT_FERRY__SHUTDOWN_DRAIN_SECONDS: ${PROMPT_FERRY__SHUTDOWN_DRAIN_SECONDS:-120}
      PROMPT_FERRY__MCP_WARMUP: ${PROMPT_FERRY__MCP_WARMUP:-all}
      PROMPT_FERRY__MCP_OAUTH_REDIRECT_BASE: ${PROMPT_FERRY__MCP_OAUTH_REDIRECT_BASE:-}
      PROMPT_FERRY__UPSTREAM_API_KEY: ${PROMPT_FERRY__UPSTREAM_API_KEY:-}
      PROMPT_FERRY__RAW_OBJECT_STORE_ENDPOINT: http://rustfs:9000
      PROMPT_FERRY__RAW_OBJECT_STORE_BUCKET: ${PROMPT_FERRY__RAW_OBJECT_STORE_BUCKET:-prompt-ferry-raw}
      PROMPT_FERRY__RAW_OBJECT_STORE_REGION: ${PROMPT_FERRY__RAW_OBJECT_STORE_REGION:-auto}
      PROMPT_FERRY__RAW_OBJECT_STORE_ACCESS_KEY: ${PROMPT_FERRY__RAW_OBJECT_STORE_ACCESS_KEY:?set object store access key}
      PROMPT_FERRY__RAW_OBJECT_STORE_SECRET_KEY: ${PROMPT_FERRY__RAW_OBJECT_STORE_SECRET_KEY:?set object store secret key}
      PROMPT_FERRY__RAW_OBJECT_STORE_PREFIX: ${PROMPT_FERRY__RAW_OBJECT_STORE_PREFIX:-prompt-ferry/raw}
      PROMPT_FERRY__RAW_OBJECT_STORE_ALLOW_HTTP: ${PROMPT_FERRY__RAW_OBJECT_STORE_ALLOW_HTTP:-true}
      PROMPT_FERRY__RAW_OBJECT_STORE_PATH_STYLE: ${PROMPT_FERRY__RAW_OBJECT_STORE_PATH_STYLE:-true}
      XDG_DATA_HOME: /var/lib/prompt-ferry
      XDG_CONFIG_HOME: /etc/prompt-ferry
    volumes:
      - prompt-ferry-data:/var/lib/prompt-ferry
      - prompt-ferry-config:/etc/prompt-ferry
      - prompt-ferry-uv-cache:/root/.cache/uv
      - prompt-ferry-uv-data:/root/.local/share/uv
    # This example uses plaintext only on a trusted local network. For native
    # TLS/mTLS replace this probe with one that validates TLS and client auth.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8787 || exit 1;
          printf 'GET /healthz HTTP/1.0\r\nHost: 127.0.0.1\r\nConnection: close\r\n\r\n' >&3;
          IFS= read -r -t 2 line <&3 || exit 1;
          line=$${line%$$'\r'}; case "$$line" in "HTTP/1.0 200"|"HTTP/1.0 200 "*|"HTTP/1.1 200"|"HTTP/1.1 200 "*) ;; *) exit 1;; esac
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    ports:
      - "127.0.0.1:${PROMPT_FERRY_PORT:-8787}:8787"

volumes:
  postgres18-data:
  valkey-data:
  rustfs-data:
  prompt-ferry-data:
  prompt-ferry-config:
  prompt-ferry-uv-cache:
  prompt-ferry-uv-data:
