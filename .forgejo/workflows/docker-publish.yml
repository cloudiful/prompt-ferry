name: Docker Publish
run-name: Docker Publish by ${{ github.actor }}

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    uses: actions/workflows/.forgejo/workflows/docker-publish.yml@v0.6.0
    with:
      builds: >-
        [{"platform":"linux/amd64","runner":"aio"}]
      before_build_command: |
        rm -rf ci-image-input
        cd frontend
        bun install --no-save --minimum-release-age 604800
        bun run openapi-ts
        bun run build
        test -f dist/index.html
      build_command: >-
        CARGO_TERM_COLOR=always
        CARGO_PROFILE_RELEASE_CODEGEN_UNITS=256
        RUSTC_WRAPPER=sccache
        SQLX_OFFLINE=true
        cargo build --release --bin prompt-ferry --timings
      binary_mappings: >-
        [{"source":"target/release/prompt-ferry","destination":"prompt-ferry"}]
      after_build_command: |
        sccache --show-stats
        "$RUST_OUTPUT_DIRECTORY/prompt-ferry" openapi export
      context: .
      dockerfile: ./forgejo.Dockerfile
      targets: >-
        [{"target":"runtime","image_suffix":""}]
      builder_name_prefix: prompt-ferry
      inline_cache: "true"
      inline_cache_tag: latest-amd64
      publish_latest: "false"
      push: true
      username: ${{ github.actor }}
    secrets:
      registry_token: ${{ secrets.REGISTRY_TOKEN }}
