name: Docker Publish
run-name: Docker Publish by ${{ github.actor }}

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    uses: actions/workflows/.forgejo/workflows/docker-publish.yml@main
    with:
      builds: >-
        [{"platform":"linux/amd64","runner":"aio"}]
      dockerfile_mode: builtin
      frontend_install_args: '["--minimum-release-age=604800"]'
      build_command: >-
        CARGO_TERM_COLOR=always
        CARGO_PROFILE_RELEASE_CODEGEN_UNITS=256
        RUSTC_WRAPPER=sccache
        SQLX_OFFLINE=true
        cargo build --release --no-default-features --bin prompt-ferry --bin export-openapi --timings
      binary_mappings: >-
        [{"source":"target/release/prompt-ferry","destination":"prompt-ferry"},{"source":"target/release/export-openapi","destination":"export-openapi","include_in_image":false}]
      after_build_command: |
        sccache --show-stats
      runtime_tools: '["uv"]'
      runtime_packages: '["bash"]'
      runtime_expose: "8787"
      builder_name_prefix: prompt-ferry
      inline_cache_tag: latest-amd64
      publish_latest: "false"
