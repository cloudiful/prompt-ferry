name: Docker Publish
run-name: Docker Publish by ${{ github.actor }}

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    uses: actions/workflows/.forgejo/workflows/docker-publish.yml@main
    with:
      builds: >-
        [{"platform":"linux/amd64","runner":"aio"}]
      dockerfile_mode: builtin
      frontend_install_args: '["--minimum-release-age=604800"]'
      frontend_build_command: |
        bun run openapi-ts
        git diff --exit-code -- src/generated/admin-api
        bun run build
        test -f dist/index.html
      build_command: >-
        CARGO_TERM_COLOR=always
        CARGO_PROFILE_RELEASE_CODEGEN_UNITS=256
        RUSTC_WRAPPER=sccache
        SQLX_OFFLINE=true
        cargo build --release --no-default-features --bin prompt-ferry --timings
      binary_mappings: >-
        [{"source":"target/release/prompt-ferry","destination":"prompt-ferry"}]
      after_build_command: |
        sccache --show-stats
        "$RUST_OUTPUT_DIRECTORY/prompt-ferry" openapi export
        git diff --exit-code -- openapi/admin-api.yaml
      runtime_tools: '["uv"]'
      runtime_packages: '["bash"]'
      runtime_expose: "8787"
      builder_name_prefix: prompt-ferry
      inline_cache_tag: latest-amd64
      publish_latest: "false"
