name: Mutation testing

# Manual-only by design (#569 Phase 2). A redaction-chain mutation batch is
# long-running, so it never triggers on pull_request or push; start it from the
# Actions UI when the redaction chain or its tests change.
on:
  workflow_dispatch:
    inputs:
      shard:
        description: "Optional shard k/n (e.g. 0/3) to split the batch across bounded runs"
        required: false
        type: string
        default: ""

concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"
  # The suite shares one PostgreSQL database schema and a process-global
  # redaction config lock; keep libtest single-threaded like
  # scripts/ci/run-tests.sh. cargo-mutants itself stays sequential (-j1).
  RUST_TEST_THREADS: "1"

jobs:
  mutants:
    runs-on: aio
    timeout-minutes: 360
    # Throwaway, job-scoped credentials for the ephemeral service containers
    # below. They are never the shared test database and never leave this job.
    env:
      PROMPT_FERRY_TEST_DATABASE_URL: postgres://prompt_ferry:prompt_ferry_ci@postgres:5432/prompt_ferry_test
      PROMPT_FERRY_TEST_VALKEY_URL: redis://valkey:6379
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: prompt_ferry
          POSTGRES_PASSWORD: prompt_ferry_ci
          POSTGRES_DB: prompt_ferry_test
        options: >-
          --health-cmd "pg_isready -U prompt_ferry -d prompt_ferry_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      valkey:
        image: valkey/valkey:8
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      - name: Require PostgreSQL and Valkey
        run: scripts/ci/require-services.sh

      # Scope comes from .cargo/mutants.toml (six redaction production files).
      # --workspace is required: the repo is a root-package workspace, so without
      # it cargo-mutants would mutate only `prompt-ferry` and silently drop
      # crates/prompt-ferry-redact-upstream/src/lib.rs (see scripts/ci/README.md).
      # --in-place mutates the ephemeral checkout; --no-shuffle keeps the mutant
      # order reproducible. An optional shard splits one batch across bounded
      # manual runs (all shards must use the same denominator).
      - name: Run mutation testing on the redaction chain
        env:
          MUTANTS_SHARD: ${{ inputs.shard }}
        run: |
          set -euo pipefail
          args=(--in-place --no-shuffle --workspace)
          if [ -n "${MUTANTS_SHARD}" ]; then
            args+=(--shard "${MUTANTS_SHARD}")
          fi
          cargo mutants "${args[@]}"

      - name: Upload mutants report
        if: always()
        uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: mutants-report
          path: mutants.out/
          if-no-files-found: warn
          retention-days: 14
